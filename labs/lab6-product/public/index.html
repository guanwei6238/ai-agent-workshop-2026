<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>社課小幫手</title>
<style>
  body { font-family: system-ui, "Noto Sans CJK TC", sans-serif; max-width: 640px;
         margin: 40px auto; padding: 0 20px; line-height: 1.7; color: #1c1c1a; }
  h1 { font-size: 22px; }
  .tag { display:inline-block; background:#e8efff; color:#1d4ed8; font-size:12px;
         padding:2px 8px; border-radius:4px; margin-left:8px; vertical-align:middle }
  textarea { width: 100%; height: 80px; font: inherit; padding: 10px;
             border: 1px solid #dedeta; border-radius: 6px; box-sizing: border-box; }
  button { font: inherit; padding: 8px 18px; border: 0; border-radius: 6px;
           background: #1d4ed8; color: #fff; cursor: pointer; margin-top: 8px; }
  button:disabled { opacity: .5; cursor: default }
  #out { white-space: pre-wrap; background: #f3f3f0; padding: 14px;
         border-radius: 6px; margin-top: 16px; min-height: 24px; }
  #meta { color: #767672; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>社課小幫手 <span class="tag">key 在後端</span></h1>
  <p>問我跟社團有關的事。</p>
  <textarea id="q" placeholder="例如：社課什麼時候？"></textarea>
  <button id="go">送出</button>
  <div id="out"></div>
  <div id="meta"></div>

<script>
const q = document.getElementById("q");
const go = document.getElementById("go");
const out = document.getElementById("out");
const meta = document.getElementById("meta");

go.onclick = async () => {
  const question = q.value.trim();
  if (!question) return;
  go.disabled = true; out.textContent = "思考中…"; meta.textContent = "";
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const j = await res.json();
    out.textContent = j.answer ?? ("錯誤：" + j.error);
    if (j.tokens) meta.textContent = `backend=${j.backend}　約 ${j.tokens} tokens　${j.ms}ms`;
  } catch (e) {
    out.textContent = "呼叫失敗：" + e.message;
  }
  go.disabled = false;
};
q.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) go.click(); });
</script>
</body>
</html>
